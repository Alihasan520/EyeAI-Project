run:
  name: hyamd_binary_efficientnetv2_s_384_regularized_run02
  seed: 42
  device: cuda

data:
  input_dir: /kaggle/input/datasets/alihasan15/hyamd-archives
  work_dir: /kaggle/working/eyeai_binary_ensemble
  image_size: 384
  binary_mode: true
  positive_labels: [1, 2]
  force_recrop: false
  validate_existing_crops: false
  num_workers: 2

model:
  name: efficientnetv2_s_384_regularized
  type: efficientnetv2_s
  timm_name: tf_efficientnetv2_s.in21k_ft_in1k
  fallback_timm_name: efficientnetv2_rw_s
  num_classes: 2
  pretrained: true
  dropout: 0.30

training:
  epochs: 15
  patience: 3
  min_delta: 0.005
  batch_size: 8
  lr: 0.00001
  head_lr: 0.0001
  weight_decay: 0.0005
  use_amp: true
  class_weight_mode: balanced_capped
  max_class_weight: 2.0
  label_smoothing: 0.03
  best_metric: val_macro_f1_at_threshold

  # Regularization against overfitting:
  # 1) Train classifier head only for the first 2 epochs.
  # 2) Then unfreeze only the last part of the CNN backbone.
  freeze_backbone_epochs: 2
  unfreeze_strategy: last_percent
  unfreeze_percent: 0.30
  optimizer_include_all_params: true

augmentation:
  rotation_degrees: 10
  horizontal_flip_prob: 0.5
  brightness: 0.08
  contrast: 0.08
  saturation: 0.04
  gaussian_blur_prob: 0.05

threshold:
  mode: balanced
  metric: macro_f1
  grid_step: 0.005
  min_recall: 0.70
  min_precision: 0.50
  min_specificity: 0.75

outputs:
  checkpoint_dir: /kaggle/working/eyeai_binary_ensemble/checkpoints
  log_dir: /kaggle/working/eyeai_binary_ensemble/logs
  prediction_dir: /kaggle/working/eyeai_binary_ensemble/predictions
