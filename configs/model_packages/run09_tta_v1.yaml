package:
  package_name: eyeai_retfound_run09_tta_v1
  model_version: retfound-run09-tta-v1
  task: binary_amd_screening
  intended_use: AI-assisted AMD screening prototype
  checkpoint_output_name: model.pth

model:
  architecture: RETFound CFP ViT-Large/16
  timm_name: vit_large_patch16_224
  num_classes: 2
  image_size: 224
  global_pool: avg
  drop_path_rate: 0.1
  class_names:
    0: Non-AMD
    1: AMD

preprocessing:
  color_mode: RGB
  crop_black_border: true
  black_threshold: 8
  crop_pad_ratio: 0.03
  make_square: true
  resize_height: 224
  resize_width: 224
  interpolation: bicubic
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
  clahe: false
  fixed_gamma: false
  roi: false

inference:
  variants: [original, hflip]
  aggregation: mean_probability
  threshold: 0.335
  positive_class: 1
  return_variant_probabilities: true

quality:
  minimum_width: 128
  minimum_height: 128
  maximum_black_fraction_warning: 0.45
  maximum_tta_disagreement_warning: 0.15

validation:
  fixed_split_tta:
    count: 233
    threshold: 0.335
    accuracy: 0.8326180257510729
    balanced_accuracy: 0.8129084967320261
    macro_f1: 0.8138405752565916
    f1_amd: 0.7547169811320755
    precision_amd: 0.759493670886076
    recall_amd: 0.75
    auc: 0.887173202614379
    average_precision: 0.8400011111531305
    specificity: 0.8758169934640523
    tn: 134
    fp: 19
    fn: 20
    tp: 60
  robust_oof_reference:
    count: 1317
    threshold: 0.6
    macro_f1: 0.6985698017148982
    auc: 0.752474064974065
    average_precision: 0.606834897928553
    note: OOF reference is retained as a conservative robustness estimate; Run 11 checkpoints were not selected as the product model.

limitations:
  - The output supports screening workflow and is not a standalone clinical diagnosis.
  - The fixed validation split was used repeatedly during model development.
  - The robust OOF estimate is lower than the fixed-split result.
  - Mild AMD representation was limited in the original fixed validation split.
  - External ARMD validation contained positive images only.
