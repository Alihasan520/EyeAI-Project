api:
  title: EyeAI Clinical Workflow API
  description: AMD screening, explainability, patient workflow, readable references, and a grounded local context-aware assistant.
  version: 3.3.0
  host: 0.0.0.0
  port: 8000
  docs_url: /docs
  redoc_url: /redoc
  openapi_url: /openapi.json

runtime:
  model_package_dir: null
  device: auto
  preload_model: true
  inference_lock: true
  release_cuda_cache_after_explanation: true

upload:
  maximum_bytes: 26214400
  allowed_content_types: [image/jpeg, image/png, image/webp, image/tiff]
  allowed_suffixes: [.jpg, .jpeg, .png, .webp, .tif, .tiff]

cors:
  allowed_origins: [http://localhost:3000, http://localhost:5173]
  allow_credentials: true
  allowed_methods: [GET, POST, PATCH]
  allowed_headers: ["*"]

quality:
  minimum_width: 512
  minimum_height: 512
  minimum_fundus_fraction: 0.45
  maximum_black_fraction: 0.55
  maximum_overexposed_fraction: 0.08
  maximum_glare_fraction: 0.03
  maximum_underexposed_fraction: 0.30
  minimum_contrast_std: 20.0
  minimum_laplacian_variance: 20.0
  maximum_tta_disagreement: 0.15

explainability:
  enabled: true
  method: gradient_weighted_patch_attribution
  target: predicted_class
  output_dir: artifacts/explanations
  artifacts_url_prefix: /artifacts
  overlay_alpha: 0.45
  black_threshold: 8
  border_fraction: 0.10
  minimum_fundus_focus: 0.75
  maximum_border_focus: 0.35
  minimum_tta_map_similarity: 0.15
  maximum_normalized_entropy: 0.96

product:
  enabled: true

database:
  url: sqlite:///artifacts/product/eyeai.db

authentication:
  bootstrap_enabled: true
  jwt_secret: development-secret-change-me
  algorithm: HS256
  access_token_minutes: 480

alerts:
  score_change_threshold: 0.20
  high_score_threshold: 0.90

reports:
  output_dir: artifacts/reports

assistant:
  enabled: true
  provider: qwen_transformers
  model_name: Qwen/Qwen3-4B-Instruct-2507
  model_dir: null
  load_in_4bit: true
  lazy_load: true
  local_files_only: true
  maximum_gpu_memory_gib: 5
  maximum_input_tokens: 3072
  maximum_new_tokens: 256
  temperature: 0.0
  top_p: 0.8
  top_k: 20
  maximum_history_messages: 4
  maximum_notes_characters: 1600
  use_cache: true
  release_cuda_cache_after_generate: true
  strict_without_rag: true
  require_inline_citations: true

rag:
  enabled: false
  index_dir: null
  embedding_model_dir: null
  embedding_device: cpu
  top_k: 3
  minimum_score: 0.20
  maximum_chunk_characters: 1800
  maximum_chunks_per_source: 1
