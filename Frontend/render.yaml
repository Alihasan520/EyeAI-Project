services:
  - type: web
    name: eyeai-clinical-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_ENABLE_PREVIEW_MODE
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
